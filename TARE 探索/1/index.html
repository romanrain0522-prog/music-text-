<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果派对 · 消消乐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>水果派对 · 消消乐</h1>
        <div class="game-info">
            <div class="score-info">
                <div>得分: <span id="score">0</span></div>
                <div>最高分: <span id="highest-score">0</span></div>
            </div>
            <div class="moves">剩余步数: <span id="moves">30</span></div>
        </div>
        <canvas id="gameCanvas" width="480" height="480"></canvas>
        <div class="controls">
            <button id="newGameBtn">新游戏</button>
            <button id="hintBtn">提示</button>
        </div>
        <div id="gameOver" class="game-over">
            <div class="game-over-content">
                <h2>游戏结束</h2>
                <p>最终分数: <span id="final-score">0</span></p>
                <p id="new-record" class="new-record"></p>
                <button id="restartBtn">再来一局</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
